name: Release

# Builds both apps and attaches them to a GitHub release. Neither is signed — this
# project has no Apple Developer ID and no Windows code-signing certificate — so the
# release notes tell people what their operating system will say on first launch.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, e.g. v0.1.0. The tag is created for you."
        required: true

jobs:
  macos:
    name: macOS app
    # macOS 26 for the SDK, so the Liquid Glass path compiles in. The app still
    # deploys to macOS 14 and falls back to a plain material there at runtime; what
    # this buys is that a Mac running 26 gets real glass rather than the fallback.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the app and a disk image
        run: ./scripts/build-macos.sh --liquid-glass --dmg

      - name: Check the bundled engine runs
        run: build/macos/PCCI.app/Contents/Resources/engine/pcci doctor

      - uses: actions/upload-artifact@v4
        with:
          name: PCCI-macos-arm64
          path: build/macos/PCCI.dmg
          if-no-files-found: error

  windows-x64:
    name: Windows app (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the app, the zip and the installer
        run: .\scripts\build-windows.ps1 -Architecture win-x64

      - name: Check the bundled engine runs
        run: build\windows\win-x64\engine\pcci.exe doctor

      - uses: actions/upload-artifact@v4
        with:
          name: PCCI-windows-x64
          path: |
            build/windows/PCCI-win-x64.zip
            build/windows/PCCI-win-x64-setup.exe
          if-no-files-found: error

  windows-arm64:
    name: Windows app (ARM64)
    # Built on a real ARM64 machine because the engine cannot be cross-compiled:
    # PyInstaller freezes with the interpreter it runs on.
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the app, the zip and the installer
        run: .\scripts\build-windows.ps1 -Architecture win-arm64

      - name: Check the bundled engine runs
        run: build\windows\win-arm64\engine\pcci.exe doctor

      - uses: actions/upload-artifact@v4
        with:
          name: PCCI-windows-arm64
          path: |
            build/windows/PCCI-win-arm64.zip
            build/windows/PCCI-win-arm64-setup.exe
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [macos, windows-x64, windows-arm64]
    runs-on: ubuntu-latest
    # Either way in: push a v* tag, or run this workflow and give it a version, which
    # creates the tag on the commit that was built.
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: PCCI ${{ inputs.tag || github.ref_name }}
          files: |
            artifacts/PCCI-macos-arm64/PCCI.dmg
            artifacts/PCCI-windows-x64/PCCI-win-x64-setup.exe
            artifacts/PCCI-windows-x64/PCCI-win-x64.zip
            artifacts/PCCI-windows-arm64/PCCI-win-arm64-setup.exe
            artifacts/PCCI-windows-arm64/PCCI-win-arm64.zip
          body: |
            ## Which file

            | You have | Download |
            |---|---|
            | A Mac | `PCCI.dmg` — Apple silicon |
            | A Windows PC, Intel or AMD | `PCCI-win-x64-setup.exe` |
            | A Windows PC on ARM (Snapdragon, Surface Pro 11) | `PCCI-win-arm64-setup.exe` |

            Not sure which Windows you have? **Settings → System → About → System
            type**. The `.zip` files are the same apps as a folder, for anyone who
            would rather not run an installer.

            The Windows installer asks whether to install for everyone or just you,
            lets you pick the folder, and can put a shortcut on your desktop.

            ## First launch

            Neither build is signed, so each system will question it once.

            **macOS** — right-click PCCI in Finder and choose **Open**, then **Open**
            again. See `docs/INSTALL_MACOS.md`.

            **Windows** — click **More info**, then **Run anyway**. See
            `docs/INSTALL_WINDOWS.md`.

            ## How tested is this

            The conversion engine is covered by 300-odd tests and is checked on Linux,
            macOS and Windows on every change, including a real conversion through the
            frozen copy that ships inside each app. Both apps are compiled and packaged
            by the same automation that produced these files.

            What has *not* happened yet is a Sunday. If something misbehaves, the engine
            log (the button in the top right) says what it saw, and issues are welcome.

            ## Setting up your stage screen

            Chords never appear on the audience output. To see them on stage, add a
            **Current Slide Notes** or **Chord Chart** element to your stage layout —
            `docs/STAGE_SETUP.md` has the steps.
          generate_release_notes: true
