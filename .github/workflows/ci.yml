name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        # All three platforms from every runner: mypy specialises sys.platform for the
        # machine it runs on, so a Linux-only check silently skips the branches the
        # other two take. Catching that here beats finding it on someone's laptop.
        run: |
          mypy pcci
          mypy --platform linux pcci
          mypy --platform darwin pcci
          mypy --platform win32 pcci

      - name: Test
        run: pytest --cov=pcci --cov-report=term-missing

  app-sanity:
    name: desktop app sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Swift and WinUI apps need macOS and Windows toolchains to compile, which is
      # what the platform jobs below are for. This job catches the cheap mistakes on
      # every push: a view file that never got added, a build script that lost its
      # executable bit.
      - name: Every source file is referenced
        run: |
          test -f macos/Package.swift
          test -f macos/Sources/PCCI/PCCIApp.swift
          test -f windows/Pcci/Pcci.csproj
          test -f windows/Pcci/MainWindow.xaml
          test -x scripts/setup-engine.sh
          test -x scripts/build-engine.sh
          test -x scripts/build-macos.sh
          for xaml in windows/Pcci/**/*.xaml windows/Pcci/*.xaml; do
            python3 -c "import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])" "$xaml"
          done

  macos-app:
    name: macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Compile the SwiftUI app
        working-directory: macos
        run: swift build -c debug

  windows-app:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build the WinUI app
        working-directory: windows
        run: dotnet build Pcci.sln -c Release -p:Platform=x64 -v:normal
