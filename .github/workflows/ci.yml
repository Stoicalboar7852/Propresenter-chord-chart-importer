name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        # All three platforms from every runner: mypy specialises sys.platform for the
        # machine it runs on, so a Linux-only check silently skips the branches the
        # other two take. Catching that here beats finding it on someone's laptop.
        run: |
          mypy pcci
          mypy --platform linux pcci
          mypy --platform darwin pcci
          mypy --platform win32 pcci

      - name: Test
        run: pytest --cov=pcci --cov-report=term-missing

      # The icons are committed so no build has to draw them. This is what keeps them
      # honest about the art they came from.
      - name: Icons match the source art
        if: matrix.os == 'ubuntu-latest'
        run: python ../scripts/make_icons.py --check

      - name: Disk image background matches its script
        if: matrix.os == 'ubuntu-latest'
        run: python ../scripts/make_dmg_background.py --check

  app-sanity:
    name: desktop app sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Swift and WinUI apps need macOS and Windows toolchains to compile, which is
      # what the platform jobs below are for. This job catches the cheap mistakes on
      # every push: a view file that never got added, a build script that lost its
      # executable bit.
      - name: Every source file is referenced
        run: |
          test -f macos/Package.swift
          test -f macos/Sources/PCCI/PCCIApp.swift
          test -f windows/Pcci/Pcci.csproj
          test -f windows/Pcci/MainWindow.xaml
          test -x scripts/setup-engine.sh
          test -x scripts/build-engine.sh
          test -x scripts/build-macos.sh
          for xaml in windows/Pcci/**/*.xaml windows/Pcci/*.xaml; do
            python3 -c "import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])" "$xaml"
          done

      - name: Python discovery holds up
        shell: pwsh
        run: ./scripts/test-setup-engine.ps1

      # A dependency with no Windows ARM64 wheel is compiled from source there, and an
      # ARM64 machine has no C++ or Rust toolchain to compile it with. That is a broken
      # install on a whole platform, found by whoever tries it rather than by us.
      - name: The engine installs on Windows without a compiler
        run: python3 scripts/check_windows_arm64.py

      # Parse errors, non-ASCII, and a local that shadows a parameter by case alone -
      # PowerShell variable names being case-insensitive, that assigns to the parameter
      # and trips its own ValidateSet, which is how the installer broke once.
      - name: PowerShell scripts hold up
        shell: pwsh
        run: ./scripts/check-powershell.ps1

  macos-app:
    name: macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Compile the SwiftUI app
        working-directory: macos
        run: swift build -c debug

  windows-engine:
    name: Windows engine setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Windows PowerShell 5.1, not pwsh 7: it is what is on a stock Windows machine,
      # and it is the stricter of the two — it turns a native program's stderr into a
      # terminating error, which is how looking for an interpreter used to abort the
      # whole script. Running the real script here is the only way to catch that.
      - name: Python discovery holds up under Windows PowerShell
        shell: powershell
        run: .\scripts\test-setup-engine.ps1

      - name: Set the engine up the way somebody installing it would
        shell: powershell
        run: .\scripts\setup-engine.ps1

      - name: The environment it built works
        shell: powershell
        run: core\.venv\Scripts\pcci.exe doctor

      # The frozen engine is what actually ships inside the app, and until now nothing
      # built one on Windows outside a release. It doctors itself and converts a real
      # chart before this passes.
      - name: Freeze the engine the way the app ships it
        shell: powershell
        run: .\scripts\build-engine.ps1 -Architecture win-x64

  windows-app:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build the WinUI app
        working-directory: windows
        run: dotnet build Pcci.sln -c Release -p:Platform=x64 -v:normal

      # The installer is build tooling like any other, so it gets built here rather
      # than discovered to be broken on release day. No engine in this folder: the
      # point is that the authoring compiles and an MSI comes out the far end.
      - name: Publish the app on its own
        run: >
          dotnet publish windows/Pcci/Pcci.csproj -c Release -r win-x64
          --self-contained true -o build/windows/ci-x64

      - name: Package it into an installer
        shell: powershell
        run: >
          .\scripts\build-installer.ps1 -Source build\windows\ci-x64
          -Output build\windows\PCCI-ci-setup.exe
