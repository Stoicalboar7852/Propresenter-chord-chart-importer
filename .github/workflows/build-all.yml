name: Build all

# Every target, from wherever you happen to be sitting.
#
# This exists because the engine cannot be cross-compiled. PyInstaller freezes using the
# interpreter it runs on, so a Windows engine has to be built on Windows and an ARM64
# one on ARM64; and the Mac app needs Xcode, which only runs on macOS. Rather than
# pretend otherwise, this runs each build on a machine that can actually do it and hands
# back the artifacts.
#
# It runs by itself on every push to the default branch, so there is always a
# freshly built copy of everything to download without anyone having to ask for it,
# and on demand for a branch:
#
#   Actions -> Build all -> Run workflow
#   scripts/build-all.sh            (or .ps1) does the same from a terminal
#
# Artifacts keep for 90 days and need a GitHub account to download. For a permanent
# link anybody can use, tag a release: release.yml attaches the same files to it.

# Several pushes in a row should not each hold a macOS and two Windows runners for
# five minutes. The newest push is the one worth building.
concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [claude/blissful-planck-pbslml]
    # Nothing in these changes what gets built.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      targets:
        description: What to build
        type: choice
        default: all
        options:
          - all
          - windows-x64
          - windows-arm64
          - macos
      windows_arm_runner:
        description: >
          Runner for the ARM64 Windows build. GitHub's windows-11-arm is free for
          public repositories; point this at a self-hosted label otherwise.
        default: windows-11-arm

jobs:
  windows-x64:
    name: Windows x64
    if: >-
      github.event_name == 'push' || inputs.targets == 'all'
      || inputs.targets == 'windows-x64'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the app, the zip and the installer
        run: .\scripts\build-windows.ps1 -Architecture win-x64

      - name: The engine inside it runs
        run: build\windows\win-x64\engine\pcci.exe doctor

      - uses: actions/upload-artifact@v4
        with:
          name: PCCI-windows-x64
          path: |
            build/windows/PCCI-win-x64.zip
            build/windows/PCCI-win-x64-setup.exe
          if-no-files-found: error
          retention-days: 90

  windows-arm64:
    name: Windows ARM64
    if: >-
      github.event_name == 'push' || inputs.targets == 'all'
      || inputs.targets == 'windows-arm64'
    runs-on: ${{ inputs.windows_arm_runner || 'windows-11-arm' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the app, the zip and the installer
        run: .\scripts\build-windows.ps1 -Architecture win-arm64

      - name: The engine inside it runs
        run: build\windows\win-arm64\engine\pcci.exe doctor

      - uses: actions/upload-artifact@v4
        with:
          name: PCCI-windows-arm64
          path: |
            build/windows/PCCI-win-arm64.zip
            build/windows/PCCI-win-arm64-setup.exe
          if-no-files-found: error
          retention-days: 90

  macos:
    name: macOS
    if: >-
      github.event_name == 'push' || inputs.targets == 'all'
      || inputs.targets == 'macos'
    # macOS 26 for the SDK, so the Liquid Glass path compiles in. The app still deploys
    # to macOS 14 and falls back to a plain material there at runtime; what this buys
    # is that a Mac running 26 gets real glass rather than the fallback.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the app and a disk image
        run: ./scripts/build-macos.sh --liquid-glass --dmg

      - name: The engine inside it runs
        run: build/macos/PCCI.app/Contents/Resources/engine/pcci doctor

      - uses: actions/upload-artifact@v4
        with:
          name: PCCI-macos-arm64
          path: build/macos/PCCI.dmg
          if-no-files-found: error
          retention-days: 90
